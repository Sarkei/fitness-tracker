# Nutrition v3 — strict CI with mandatory DB-backed checks

.nutrition-node-base:
  image: node:20-bookworm
  variables:
    POSTGRES_DB: fitness_tracker
    POSTGRES_USER: vrtx
    POSTGRES_PASSWORD: vrtx_secret
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  before_script:
    - npm ci --legacy-peer-deps

.nutrition-postgres:
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: fitness_tracker
    POSTGRES_USER: vrtx
    POSTGRES_PASSWORD: vrtx_secret
    FF_NETWORK_PER_BUILD: "true"

nutrition:strict:
  extends:
    - .nutrition-node-base
    - .nutrition-postgres
  stage: test
  script:
    - npm run ci:nutrition:strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
