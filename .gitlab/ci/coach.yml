# Coach v2 — Unit-Tests, E2E (Mock), Ops-Check, optional Live-E2E auf Staging
#
# CI-Variablen (GitLab → Settings → CI/CD → Variables):
#   MISTRAL_API_KEY / GEMINI_API_KEY  — für coach:e2e:live (masked)
#   COACH_ALERT_WEBHOOK_URL           — optional, für coach:ops:alert auf main
#   JWT_SECRET, ADMIN_*               — für deploy jobs (masked)

.coach-node-base:
  image: node:20-bookworm
  variables:
    POSTGRES_DB: fitness_tracker
    POSTGRES_USER: vrtx
    POSTGRES_PASSWORD: vrtx_secret
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  before_script:
    - npm ci --legacy-peer-deps

.coach-postgres:
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: fitness_tracker
    POSTGRES_USER: vrtx
    POSTGRES_PASSWORD: vrtx_secret
    FF_NETWORK_PER_BUILD: "true"

coach:unit:
  extends:
    - .coach-node-base
    - .coach-postgres
  stage: test
  script:
    - npm run test:coach:all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

coach:e2e:
  extends:
    - .coach-postgres
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  stage: test
  variables:
    CI: "true"
    COACH_E2E_MOCK: "1"
  before_script:
    - npm ci --legacy-peer-deps
    - npx playwright install --with-deps chromium
  script:
    - npm run test:e2e:coach
  artifacts:
    when: on_failure
    paths:
      - test-results/
      - playwright-report/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

coach:ops:
  extends:
    - .coach-node-base
    - .coach-postgres
  stage: test
  script:
    - npm run ops:coach
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coach:e2e:live:
  extends:
    - .coach-postgres
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  stage: staging
  variables:
    CI: "true"
    COACH_E2E_MOCK: "0"
    COACH_E2E_LIVE: "1"
  before_script:
    - npm ci --legacy-peer-deps
    - npx playwright install --with-deps chromium
  script:
    - npm run test:e2e:coach:live
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report-staging/
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" && $COACH_E2E_LIVE == "1"
      when: manual
  timeout: 25m

coach:ops:alert:
  extends:
    - .coach-node-base
    - .coach-postgres
  stage: deploy
  script:
    - npm run ops:coach:alert
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $COACH_ALERT_WEBHOOK_URL
      when: delayed
      start_in: 5 minutes
  allow_failure: true
